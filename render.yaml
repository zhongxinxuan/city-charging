# Render 一键部署配置（https://render.com）
# 用法：仓库推到 GitHub 后，在 Render 选 "New +" → "Blueprint"，选中本仓库即可。
services:
  - type: web
    name: city-charging
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m backend.init_db
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
